<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>XWALK — Red & Green Man</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: #1a1a2e;
    color: #eee;
    font-family: 'Press Start 2P', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    overflow: hidden;
    padding-top: 6px;
    touch-action: none;
  }
  h1 {
    font-size: 15px;
    margin-bottom: 4px;
    color: #ffcc00;
    text-shadow: 2px 2px 0 #000;
  }
  #game-wrap {
    position: relative;
    border: 4px solid #444;
    box-shadow: 0 0 16px #000;
    max-width: 100vw;
  }
  canvas {
    display: block;
    width: 100%;
    max-width: 720px;
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #111;
    touch-action: none;
  }
  #ui {
    width: 100%;
    max-width: 720px;
    margin-top: 6px;
    text-align: center;
    font-size: 10px;
    line-height: 1.45;
    padding: 0 6px;
  }
  .btn {
    display: inline-block;
    padding: 12px 18px;
    margin: 5px;
    background: #222;
    border: 3px solid #666;
    color: #fff;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
  }
  .btn:active { transform: scale(0.96); }
  .btn.red { border-color: #c00; color: #f66; }
  .btn.green { border-color: #0a0; color: #6f6; }
  #timer { color: #ffcc00; font-size: 14px; }
  #msg { min-height: 26px; margin: 4px 0; font-size: 11px; }

  #touch-controls {
    display: none;
    width: 100%;
    max-width: 720px;
    margin-top: 8px;
    gap: 14px;
    justify-content: center;
    align-items: center;
  }
  .tbtn {
    width: 76px;
    height: 76px;
    background: #222;
    border: 4px solid #555;
    color: #fff;
    font-size: 30px;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    border-radius: 10px;
  }
  .tbtn:active, .tbtn.active {
    background: #333;
    border-color: #ffcc00;
    color: #ffcc00;
  }
  .tbtn.fwd {
    width: 96px;
    height: 96px;
    font-size: 34px;
    border-color: #0a0;
  }
</style>
</head>
<body>
  <h1>XWALK</h1>
  <div id="game-wrap">
    <canvas id="c" width="720" height="400"></canvas>
  </div>
  <div id="ui">
    <div id="msg">Choose your man</div>
    <div id="menu">
      <button class="btn red" id="btn-red">RED MAN</button>
      <button class="btn green" id="btn-green">GREEN MAN</button>
    </div>
    <div id="hud" style="display:none">
      <span id="timer">60</span>s
    </div>
  </div>

  <div id="touch-controls">
    <button class="tbtn" id="t-left">◀</button>
    <button class="tbtn fwd" id="t-fwd">▶</button>
    <button class="tbtn" id="t-right">▶▶</button>
  </div>

<script>
// ============================================================
// XWALK — Side-scroller Ampelmännchen
// Left → Right piano-key crosswalk
// Red Man locked akimbo • Touch-first
// ============================================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// Logical resolution (side-scroller landscape)
const W = 360, H = 200;
const SCALE = 2; // displayed 720×400

const PAL = {
  black: '#000000',
  dark:  '#1a1a2e',
  gray:  '#555555',
  light: '#aaaaaa',
  white: '#eeeeee',
  red:   '#cc0000',
  green: '#00aa00',
  yellow:'#ffcc00',
  blue:  '#2244aa',
  cyan:  '#44aaaa',
  orange:'#cc6600',
  road:  '#1c1c1c',
  curb:  '#5a5a5a',
  keyW:  '#e8e0c8',
  keyB:  '#111111',
  sky:   '#2a2a4a',
};

let state = 'menu';
let manColor = 'green';
let timer = 60;
let stillTimer = 0;
let lastMove = 0;
let frame = 0;
let cars = [];
let player = { x: 28, y: 148, vx: 0, vy: 0, onGround: true, hopCooldown: 0 };

// Single horizontal piano-key path (the crosswalk)
const PIANO = {
  y: 132,      // top of the key band
  h: 28,       // height of keys
  // keys stretch almost full width, leaving sidewalks on left & right
};

function resetGame(color) {
  manColor = color;
  state = 'play';
  timer = 60;
  stillTimer = 0;
  lastMove = performance.now();
  frame = 0;
  cars = [];
  player = { x: 28, y: 148, vx: 0, vy: 0, onGround: true, hopCooldown: 0 };

  document.getElementById('menu').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  document.getElementById('msg').textContent = '';

  const tc = document.getElementById('touch-controls');
  if (color === 'green') {
    tc.style.display = 'flex';
  } else {
    tc.style.display = 'none';
    document.getElementById('msg').textContent = 'RED MAN stands akimbo…';
  }
}

// Touch hops (Green only) — primarily rightward progress
function doHop(dx, dy) {
  if (state !== 'play' || manColor !== 'green' || player.hopCooldown > 0) return;
  player.vx = dx;
  player.vy = dy;
  player.hopCooldown = 13;
  player.onGround = false;
  lastMove = performance.now();
  stillTimer = 0;
}

document.getElementById('t-left').addEventListener('pointerdown', e => {
  e.preventDefault();
  doHop(-3.8, -2.2);          // small left + hop
});
document.getElementById('t-fwd').addEventListener('pointerdown', e => {
  e.preventDefault();
  doHop(5.2, -2.8);           // main right hop
});
document.getElementById('t-right').addEventListener('pointerdown', e => {
  e.preventDefault();
  doHop(7.0, -1.5);           // longer right hop
});

// Tap canvas = hop right (Green) or retry
canvas.addEventListener('pointerdown', e => {
  if (state === 'play' && manColor === 'green') {
    doHop(5.2, -2.8);
  } else if (state === 'dead' || state === 'win') {
    state = 'menu';
    document.getElementById('menu').style.display = 'block';
    document.getElementById('hud').style.display = 'none';
    document.getElementById('touch-controls').style.display = 'none';
    document.getElementById('msg').textContent = 'Choose your man';
  }
});

document.getElementById('btn-red').onclick = () => resetGame('red');
document.getElementById('btn-green').onclick = () => resetGame('green');

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// Safe: left sidewalk, right sidewalk, or on the piano-key band
function isOnSafe(px, py) {
  // left sidewalk
  if (px < 42) return true;
  // right sidewalk
  if (px > 318) return true;
  // piano keys (horizontal band)
  if (py >= PIANO.y && py <= PIANO.y + PIANO.h + 6) return true;
  return false;
}

function spawnCar() {
  // Cars travel horizontally in the road, staying OFF the piano paint
  const fromLeft = Math.random() < 0.5;
  // Two possible vertical lanes that avoid the key band
  const above = Math.random() < 0.5;
  const y = above ? 78 + Math.random() * 28 : 168 + Math.random() * 18;

  cars.push({
    x: fromLeft ? -50 : W + 20,
    y: y,
    w: 42,
    h: 18,
    vx: fromLeft ? (2.0 + Math.random() * 2.2) : -(2.0 + Math.random() * 2.2),
    color: Math.random() < 0.28 ? PAL.red : (Math.random() < 0.5 ? PAL.blue : PAL.orange)
  });
}

function update(dt) {
  if (state !== 'play') return;
  frame++;

  timer -= dt;
  if (timer <= 0) {
    timer = 0;
    state = 'dead';
    document.getElementById('msg').textContent = 'TIME UP — RUN OVER!';
    document.getElementById('touch-controls').style.display = 'none';
    return;
  }

  if (manColor === 'red') {
    stillTimer = (performance.now() - lastMove) / 1000;
    if (stillTimer >= 60) {
      state = 'dead';
      document.getElementById('msg').textContent = 'RED MAN TIMED OUT';
      return;
    }
    player.vx = 0;
    player.vy = 0;
  } else {
    if (player.hopCooldown > 0) player.hopCooldown--;

    player.x += player.vx;
    player.y += player.vy;

    // gravity-ish settle toward the key height when in air
    if (!player.onGround) {
      player.vy += 0.22;
    }

    player.vx *= 0.80;
    if (Math.abs(player.vx) < 0.18) player.vx = 0;

    // land on keys or sidewalks
    if (player.vy > 0 && isOnSafe(player.x, player.y)) {
      // snap to standing height on keys / sidewalk
      if (player.x > 42 && player.x < 318) {
        player.y = PIANO.y + 18;
      } else {
        player.y = 148;
      }
      player.vy = 0;
      player.onGround = true;
    }

    // clamp
    player.x = Math.max(14, Math.min(346, player.x));
    player.y = Math.max(60, Math.min(175, player.y));

    // death check when settled
    if (player.onGround && !isOnSafe(player.x, player.y)) {
      state = 'dead';
      document.getElementById('msg').textContent = 'HIT BLACKTOP — RUN OVER!';
      document.getElementById('touch-controls').style.display = 'none';
      return;
    }
  }

  // Cars
  if (frame % 36 === 0) spawnCar();
  for (let i = cars.length - 1; i >= 0; i--) {
    const c = cars[i];
    c.x += c.vx;

    // keep cars off the piano paint
    if (c.y + c.h > PIANO.y && c.y < PIANO.y + PIANO.h) {
      if (c.y < PIANO.y + PIANO.h / 2) c.y = PIANO.y - c.h - 3;
      else c.y = PIANO.y + PIANO.h + 3;
    }

    if (c.x < -60 || c.x > W + 40) {
      cars.splice(i, 1);
      continue;
    }

    if (manColor === 'green') {
      const pbox = { x: player.x - 8, y: player.y - 18, w: 16, h: 22 };
      if (rectsOverlap(pbox, c)) {
        state = 'dead';
        document.getElementById('msg').textContent = 'HIT BY CAR — RUN OVER!';
        document.getElementById('touch-controls').style.display = 'none';
        return;
      }
    }
  }

  // Win: reach right sidewalk
  if (manColor === 'green' && player.x >= 322) {
    state = 'win';
    document.getElementById('msg').textContent = 'YOU CROSSED!';
    document.getElementById('touch-controls').style.display = 'none';
  }

  document.getElementById('timer').textContent = Math.ceil(timer);
}

function drawRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
}

// Larger side-view / 3/4 Ampelmännchen (2× size)
function drawMan(x, y, color, isRed) {
  const c = color === 'red' ? PAL.red : PAL.green;

  if (isRed) {
    // Classic front-facing akimbo (stop)
    drawRect(x - 6, y - 20, 12, 9, c);   // head
    drawRect(x - 5, y - 11, 10, 11, c);  // body
    // arms fully out
    drawRect(x - 16, y - 9, 11, 6, c);
    drawRect(x + 5, y - 9, 11, 6, c);
    drawRect(x - 18, y - 8, 3, 4, c);
    drawRect(x + 15, y - 8, 3, 4, c);
    // legs together
    drawRect(x - 4, y, 4, 9, c);
    drawRect(x + 1, y, 4, 9, c);
  } else {
    // Green — side-view-ish hop / walk facing right
    const walk = (frame >> 2) % 2;
    // head
    drawRect(x - 4, y - 20, 11, 9, c);
    // body
    drawRect(x - 3, y - 11, 9, 11, c);
    // arm forward / back
    if (walk) {
      drawRect(x + 5, y - 9, 8, 5, c);
      drawRect(x - 7, y - 7, 5, 5, c);
    } else {
      drawRect(x + 4, y - 8, 7, 5, c);
      drawRect(x - 6, y - 9, 5, 5, c);
    }
    // legs
    if (walk) {
      drawRect(x - 2, y, 5, 8, c);
      drawRect(x + 4, y + 2, 5, 7, c);
    } else {
      drawRect(x - 3, y + 1, 5, 7, c);
      drawRect(x + 3, y, 5, 8, c);
    }
  }
}

function drawCar(c) {
  drawRect(c.x, c.y, c.w, c.h, c.color);
  drawRect(c.x + 7, c.y + 3, 9, 7, PAL.cyan);
  drawRect(c.x + 22, c.y + 3, 9, 7, PAL.cyan);
  drawRect(c.x + 4, c.y + 13, 7, 6, PAL.black);
  drawRect(c.x + 30, c.y + 13, 7, 6, PAL.black);
}

function drawPianoKeys() {
  const y = PIANO.y;
  const h = PIANO.h;

  // full white base across the road (the painted crosswalk)
  drawRect(42, y, 276, h, PAL.keyW);

  // piano key pattern: white keys + black key overlays
  const whiteW = 20;
  let x = 42;
  let i = 0;
  while (x < 318) {
    // subtle vertical separator
    drawRect(x + whiteW - 1, y, 2, h, '#c8c0a8');

    // black keys (shorter) following a simple piano pattern
    if (i % 7 !== 2 && i % 7 !== 6) {
      const bx = x + whiteW - 6;
      if (bx > 44 && bx + 11 < 316) {
        drawRect(bx, y, 11, Math.floor(h * 0.58), PAL.keyB);
      }
    }
    x += whiteW;
    i++;
  }

  // edge definition
  drawRect(42, y, 276, 2, '#d0c8b0');
  drawRect(42, y + h - 2, 276, 2, '#b0a890');
}

function draw() {
  // sky / background
  drawRect(0, 0, W, H, PAL.sky);

  // distant buildings hint (very simple)
  drawRect(0, 40, W, 50, '#222233');
  for (let i = 0; i < 12; i++) {
    const bx = 10 + i * 30;
    drawRect(bx, 28 + (i % 3) * 6, 18, 62, '#2a2a3a');
    drawRect(bx + 4, 34, 4, 4, '#445');
    drawRect(bx + 10, 34, 4, 4, '#445');
  }

  // Road surface
  drawRect(0, 70, W, 130, PAL.road);

  // Left sidewalk
  drawRect(0, 70, 42, 130, PAL.curb);
  drawRect(40, 70, 3, 130, PAL.light);

  // Right sidewalk
  drawRect(318, 70, 42, 130, PAL.curb);
  drawRect(318, 70, 3, 130, PAL.light);

  // faint road lines (avoid keys)
  for (let lx = 50; lx < 310; lx += 28) {
    drawRect(lx, 100, 14, 2, '#333');
    drawRect(lx, 175, 14, 2, '#333');
  }

  // The horizontal piano-key crosswalk
  drawPianoKeys();

  // Cars
  cars.forEach(drawCar);

  // Player
  if (state !== 'menu') {
    drawMan(player.x, player.y, manColor, manColor === 'red');
  }

  // Menu
  if (state === 'menu') {
    ctx.fillStyle = 'rgba(0,0,0,0.62)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = PAL.yellow;
    ctx.font = '18px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText('XWALK', W / 2, 55);
    ctx.fillStyle = PAL.white;
    ctx.font = '8px "Press Start 2P"';
    ctx.fillText('Left → Right side-scroller', W / 2, 85);
    ctx.fillText('Hop the piano keys', W / 2, 102);
    ctx.fillText('Green hops  •  Red stands', W / 2, 119);
  }

  if (state === 'dead' || state === 'win') {
    ctx.fillStyle = 'rgba(0,0,0,0.68)';
    ctx.fillRect(0, 60, W, 80);
    ctx.fillStyle = state === 'win' ? PAL.green : PAL.red;
    ctx.font = '16px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText(state === 'win' ? 'SAFE!' : 'RUN OVER', W / 2, 95);
    ctx.fillStyle = PAL.white;
    ctx.font = '8px "Press Start 2P"';
    ctx.fillText('TAP to retry', W / 2, 120);
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  ctx.save();
  ctx.scale(SCALE, SCALE);
  draw();
  ctx.restore();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
