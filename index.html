<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>XWALK — Red & Green Man</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: #1a1a2e;
    color: #eee;
    font-family: 'Press Start 2P', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    overflow: hidden;
    padding-top: 6px;
    touch-action: none;
  }
  h1 {
    font-size: 15px;
    margin-bottom: 4px;
    color: #ffcc00;
    text-shadow: 2px 2px 0 #000;
  }
  #game-wrap {
    position: relative;
    border: 4px solid #444;
    box-shadow: 0 0 16px #000;
    max-width: 100vw;
  }
  canvas {
    display: block;
    width: 100%;
    max-width: 720px;
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #111;
    touch-action: none;
  }
  #ui {
    width: 100%;
    max-width: 720px;
    margin-top: 6px;
    text-align: center;
    font-size: 10px;
    line-height: 1.45;
    padding: 0 6px;
  }
  .btn {
    display: inline-block;
    padding: 12px 18px;
    margin: 5px;
    background: #222;
    border: 3px solid #666;
    color: #fff;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
  }
  .btn:active { transform: scale(0.96); }
  .btn.red { border-color: #c00; color: #f66; }
  .btn.green { border-color: #0a0; color: #6f6; }
  #timer { color: #ffcc00; font-size: 14px; }
  #msg { min-height: 26px; margin: 4px 0; font-size: 11px; }

  #touch-controls {
    display: none;
    width: 100%;
    max-width: 720px;
    margin-top: 10px;
    justify-content: center;
  }
  #hold-btn {
    width: 200px;
    height: 88px;
    background: #1a3a1a;
    border: 5px solid #0a0;
    color: #6f6;
    font-family: inherit;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    border-radius: 12px;
    gap: 4px;
  }
  #hold-btn:active, #hold-btn.holding {
    background: #2a5a2a;
    border-color: #ffcc00;
    color: #ffcc00;
  }
  #charge-bar {
    width: 160px;
    height: 10px;
    background: #111;
    border: 2px solid #444;
    margin-top: 2px;
  }
  #charge-fill {
    height: 100%;
    width: 0%;
    background: #0a0;
  }
</style>
</head>
<body>
  <h1>XWALK</h1>
  <div id="game-wrap">
    <canvas id="c" width="720" height="400"></canvas>
  </div>
  <div id="ui">
    <div id="msg">Choose your man</div>
    <div id="menu">
      <button class="btn red" id="btn-red">RED MAN</button>
      <button class="btn green" id="btn-green">GREEN MAN</button>
    </div>
    <div id="hud" style="display:none">
      <span id="timer">60</span>s
    </div>
  </div>

  <div id="touch-controls">
    <button id="hold-btn">
      <span>HOLD TO HOP</span>
      <div id="charge-bar"><div id="charge-fill"></div></div>
    </button>
  </div>

<script>
// ============================================================
// XWALK — High-detail classic Ampelmännchen
// Using as many pixels as needed for clear recognition
// ============================================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const W = 360, H = 200;
const SCALE = 2;

const PAL = {
  black: '#000000',
  dark:  '#1a1a2e',
  gray:  '#555555',
  light: '#aaaaaa',
  white: '#eeeeee',
  red:   '#e01010',
  green: '#10c060',
  yellow:'#ffcc00',
  blue:  '#2244aa',
  cyan:  '#44aaaa',
  orange:'#cc6600',
  road:  '#1c1c1c',
  curb:  '#5a5a5a',
  stripe:'#e8e0c8',
  sky:   '#2a2a4a',
};

const STRIPE_W = 14;
const MAX_STRIPES = 2;
const ZEBRA_LEFT = 42;
const ZEBRA_RIGHT = 318;

let state = 'menu';
let manColor = 'green';
let timer = 60;
let stillTimer = 0;
let lastMove = 0;
let frame = 0;
let cars = [];
let player = { x: 28, y: 148, vx: 0, vy: 0, onGround: true, hopCooldown: 0 };

const ZEBRA = { y: 132, h: 28 };

let charging = false;
let chargeStart = 0;
let charge = 0;
const MAX_CHARGE_MS = 700;

function isWhiteStripe(px) {
  if (px < ZEBRA_LEFT || px > ZEBRA_RIGHT) return false;
  const local = px - ZEBRA_LEFT;
  const index = Math.floor(local / STRIPE_W);
  return (index % 2) === 0;
}

function getBlackGapCenters() {
  const centers = [];
  let x = ZEBRA_LEFT + STRIPE_W;
  while (x + STRIPE_W / 2 < ZEBRA_RIGHT) {
    centers.push(x + STRIPE_W / 2);
    x += STRIPE_W * 2;
  }
  return centers;
}

function resetGame(color) {
  manColor = color;
  state = 'play';
  timer = 60;
  stillTimer = 0;
  lastMove = performance.now();
  frame = 0;
  cars = [];
  player = { x: 28, y: 148, vx: 0, vy: 0, onGround: true, hopCooldown: 0 };
  charging = false;
  charge = 0;
  updateChargeBar();

  document.getElementById('menu').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  document.getElementById('msg').textContent = '';

  const tc = document.getElementById('touch-controls');
  if (color === 'green') {
    tc.style.display = 'flex';
  } else {
    tc.style.display = 'none';
    document.getElementById('msg').textContent = 'RED MAN stands still…';
  }
}

function updateChargeBar() {
  const fill = document.getElementById('charge-fill');
  fill.style.width = (charge * 100) + '%';
  fill.style.background = charge > 0.7 ? '#ffcc00' : '#0a0';
}

function startCharge(e) {
  if (e) e.preventDefault();
  if (state !== 'play' || manColor !== 'green' || !player.onGround || player.hopCooldown > 0) return;
  charging = true;
  chargeStart = performance.now();
  charge = 0;
  document.getElementById('hold-btn').classList.add('holding');
}

function endCharge(e) {
  if (e) e.preventDefault();
  if (!charging) return;
  charging = false;
  document.getElementById('hold-btn').classList.remove('holding');

  if (state !== 'play' || manColor !== 'green' || !player.onGround) {
    charge = 0;
    updateChargeBar();
    return;
  }

  const power = Math.max(0.2, Math.min(1, charge));
  const maxDist = STRIPE_W * MAX_STRIPES;
  const hopRight = 4 + power * (maxDist - 4);
  const hopUp   = 1.8 + power * 2.4;

  player.vx = hopRight;
  player.vy = -hopUp;
  player.onGround = false;
  player.hopCooldown = 8;
  lastMove = performance.now();
  stillTimer = 0;

  charge = 0;
  updateChargeBar();
}

const holdBtn = document.getElementById('hold-btn');
holdBtn.addEventListener('pointerdown', startCharge);
holdBtn.addEventListener('pointerup', endCharge);
holdBtn.addEventListener('pointerleave', endCharge);
holdBtn.addEventListener('pointercancel', endCharge);

canvas.addEventListener('pointerdown', e => {
  if (state === 'play' && manColor === 'green') {
    startCharge(e);
  } else if (state === 'dead' || state === 'win') {
    state = 'menu';
    document.getElementById('menu').style.display = 'block';
    document.getElementById('hud').style.display = 'none';
    document.getElementById('touch-controls').style.display = 'none';
    document.getElementById('msg').textContent = 'Choose your man';
  }
});
canvas.addEventListener('pointerup', endCharge);
canvas.addEventListener('pointercancel', endCharge);

document.getElementById('btn-red').onclick = () => resetGame('red');
document.getElementById('btn-green').onclick = () => resetGame('green');

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function isOnSafe(px, py) {
  if (px < ZEBRA_LEFT) return true;
  if (px > ZEBRA_RIGHT) return true;
  if (py >= ZEBRA.y && py <= ZEBRA.y + ZEBRA.h + 6) {
    return isWhiteStripe(px);
  }
  return false;
}

function triggerCarHit(px) {
  cars.push({
    x: px - 9,
    y: player.y - 30,
    w: 18,
    h: 28,
    vx: 0,
    vy: 6,
    color: PAL.red
  });
  state = 'dead';
  document.getElementById('msg').textContent = 'HIT BLACKTOP — RUN OVER!';
  document.getElementById('touch-controls').style.display = 'none';
  charging = false;
}

function spawnCar() {
  const gaps = getBlackGapCenters();
  if (gaps.length === 0) return;
  const laneX = gaps[Math.floor(Math.random() * gaps.length)] - 9;
  const fromTop = Math.random() < 0.5;

  cars.push({
    x: laneX,
    y: fromTop ? 55 : 195,
    w: 18,
    h: 28,
    vx: 0,
    vy: fromTop ? (1.8 + Math.random() * 1.6) : -(1.8 + Math.random() * 1.6),
    color: Math.random() < 0.28 ? PAL.red : (Math.random() < 0.5 ? PAL.blue : PAL.orange)
  });
}

function update(dt) {
  if (state !== 'play') return;
  frame++;

  if (charging) {
    const held = performance.now() - chargeStart;
    charge = Math.min(1, held / MAX_CHARGE_MS);
    updateChargeBar();
  }

  timer -= dt;
  if (timer <= 0) {
    timer = 0;
    state = 'dead';
    document.getElementById('msg').textContent = 'TIME UP — RUN OVER!';
    document.getElementById('touch-controls').style.display = 'none';
    charging = false;
    return;
  }

  if (manColor === 'red') {
    stillTimer = (performance.now() - lastMove) / 1000;
    if (stillTimer >= 60) {
      state = 'dead';
      document.getElementById('msg').textContent = 'RED MAN TIMED OUT';
      return;
    }
    player.vx = 0;
    player.vy = 0;
  } else {
    if (player.hopCooldown > 0) player.hopCooldown--;

    player.x += player.vx;
    player.y += player.vy;

    if (!player.onGround) player.vy += 0.30;
    player.vx *= 0.98;

    if (player.vy > 0) {
      if (player.y >= ZEBRA.y && player.y <= ZEBRA.y + ZEBRA.h + 8) {
        if (isWhiteStripe(player.x)) {
          player.y = ZEBRA.y + 18;
          player.vy = 0;
          player.vx = 0;
          player.onGround = true;
        } else if (player.x > ZEBRA_LEFT && player.x < ZEBRA_RIGHT) {
          triggerCarHit(player.x);
          return;
        }
      } else if (player.x < ZEBRA_LEFT || player.x > ZEBRA_RIGHT) {
        player.y = 148;
        player.vy = 0;
        player.vx = 0;
        player.onGround = true;
      } else if (player.y > ZEBRA.y + ZEBRA.h + 10) {
        triggerCarHit(player.x);
        return;
      }
    }

    player.x = Math.max(14, Math.min(346, player.x));
    player.y = Math.max(50, Math.min(180, player.y));

    if (player.onGround && !isOnSafe(player.x, player.y)) {
      triggerCarHit(player.x);
      return;
    }
  }

  if (frame % 40 === 0) spawnCar();
  for (let i = cars.length - 1; i >= 0; i--) {
    const c = cars[i];
    c.y += c.vy;
    if (c.y < 40 || c.y > 210) {
      cars.splice(i, 1);
      continue;
    }
    if (manColor === 'green' && state === 'play') {
      const pbox = { x: player.x - 10, y: player.y - 22, w: 20, h: 26 };
      if (rectsOverlap(pbox, c)) {
        state = 'dead';
        document.getElementById('msg').textContent = 'HIT BY CAR — RUN OVER!';
        document.getElementById('touch-controls').style.display = 'none';
        charging = false;
        return;
      }
    }
  }

  if (manColor === 'green' && player.x >= 322) {
    state = 'win';
    document.getElementById('msg').textContent = 'YOU CROSSED!';
    document.getElementById('touch-controls').style.display = 'none';
    charging = false;
  }

  document.getElementById('timer').textContent = Math.ceil(timer);
}

function drawRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
}

// ============================================================
// HIGH-DETAIL AMPELMÄNNCHEN
// Drawn with many small pixels so the classic shapes read clearly
// ============================================================

function drawRedMan(x, y, scale) {
  const s = scale || 1;
  const c = PAL.red;
  const p = (ox, oy, w, h) => drawRect(x + ox * s, y + oy * s, w * s, h * s, c);

  // === HAT (peaked / wide brim — the signature look) ===
  // brim
  p(-11, -26, 22, 3);
  p(-10, -27, 20, 1);
  // crown
  p(-7, -31, 14, 5);
  p(-6, -32, 12, 1);
  // side peaks of the brim
  p(-12, -25, 3, 2);
  p(9, -25, 3, 2);

  // === HEAD ===
  p(-6, -23, 12, 8);
  p(-5, -24, 10, 1);

  // === TORSO (coat-like, slightly wider at bottom) ===
  p(-7, -15, 14, 14);
  p(-8, -4, 16, 6);
  p(-7, 1, 14, 3);

  // === ARMS FULLY OUT (classic stop pose) ===
  // left arm
  p(-17, -12, 10, 4);
  p(-19, -11, 4, 4);
  // left hand (rounded)
  p(-21, -10, 4, 4);
  p(-22, -9, 2, 2);
  // right arm
  p(7, -12, 10, 4);
  p(15, -11, 4, 4);
  // right hand
  p(17, -10, 4, 4);
  p(20, -9, 2, 2);

  // === LEGS + BASE (together, pedestal feel) ===
  p(-5, 4, 4, 9);
  p(1, 4, 4, 9);
  p(-6, 12, 12, 3);
  p(-5, 14, 10, 1);
}

function drawGreenMan(x, y, scale, walking) {
  const s = scale || 1;
  const c = PAL.green;
  const p = (ox, oy, w, h) => drawRect(x + ox * s, y + oy * s, w * s, h * s, c);

  // === HAT ===
  p(-10, -27, 20, 3);
  p(-9, -28, 18, 1);
  p(-6, -32, 13, 5);
  p(-5, -33, 11, 1);
  p(-11, -26, 3, 2);
  p(8, -26, 3, 2);

  // === HEAD ===
  p(-5, -24, 12, 8);
  p(-4, -25, 10, 1);

  // === TORSO ===
  p(-6, -16, 13, 13);

  if (walking) {
    // === STRIDING POSE (classic green Ampelmännchen) ===
    // front arm reaching forward
    p(6, -13, 9, 4);
    p(13, -12, 4, 4);
    p(15, -11, 3, 3);
    // back arm
    p(-10, -11, 5, 4);
    p(-12, -10, 3, 3);

    // back leg
    p(-7, -2, 5, 8);
    p(-8, 5, 4, 4);
    // front leg extended
    p(2, 0, 6, 10);
    p(5, 9, 5, 4);
    p(8, 12, 4, 2);
  } else {
    // standing / mid-step
    p(5, -12, 8, 4);
    p(11, -11, 4, 3);
    p(-9, -11, 5, 4);
    p(-5, -2, 5, 10);
    p(2, 0, 5, 10);
    p(-6, 10, 13, 3);
  }
}

function drawMan(x, y, color, isRed) {
  if (isRed) {
    drawRedMan(x, y, 1);
  } else {
    const walk = !player.onGround || (frame >> 2) % 2;
    drawGreenMan(x, y, 1, walk);
  }
}

function drawCar(c) {
  drawRect(c.x, c.y, c.w, c.h, c.color);
  drawRect(c.x + 3, c.y + 4, 12, 6, PAL.cyan);
  drawRect(c.x + 3, c.y + 14, 12, 6, PAL.cyan);
  drawRect(c.x + 1, c.y + 2, 4, 4, PAL.black);
  drawRect(c.x + 13, c.y + 2, 4, 4, PAL.black);
  drawRect(c.x + 1, c.y + 22, 4, 4, PAL.black);
  drawRect(c.x + 13, c.y + 22, 4, 4, PAL.black);
}

function drawZebra() {
  const y = ZEBRA.y;
  const h = ZEBRA.h;
  let x = ZEBRA_LEFT;
  let light = true;
  while (x < ZEBRA_RIGHT) {
    if (light) drawRect(x, y, STRIPE_W, h, PAL.stripe);
    x += STRIPE_W;
    light = !light;
  }
  drawRect(ZEBRA_LEFT, y, ZEBRA_RIGHT - ZEBRA_LEFT, 1, '#d0c8b0');
  drawRect(ZEBRA_LEFT, y + h - 1, ZEBRA_RIGHT - ZEBRA_LEFT, 1, '#b0a890');
}

function drawPedSignal(cx, cy) {
  // larger housing for the detailed figures
  drawRect(cx - 44, cy - 84, 88, 172, '#222');
  drawRect(cx - 40, cy - 80, 80, 164, '#0a0a0a');

  // red lens
  drawRect(cx - 34, cy - 74, 68, 70, '#1a0000');
  drawRect(cx - 32, cy - 72, 64, 66, '#2a0000');
  drawRedMan(cx, cy - 42, 1.9);

  // divider
  drawRect(cx - 40, cy - 2, 80, 5, '#333');

  // green lens
  drawRect(cx - 34, cy + 6, 68, 70, '#001a08');
  drawRect(cx - 32, cy + 8, 64, 66, '#002a10');
  drawGreenMan(cx, cy + 40, 1.9, true);

  // rims
  drawRect(cx - 40, cy - 80, 80, 3, '#444');
  drawRect(cx - 40, cy - 4, 80, 3, '#444');
  drawRect(cx - 40, cy + 74, 80, 3, '#444');
}

function draw() {
  drawRect(0, 0, W, H, PAL.sky);

  drawRect(0, 40, W, 50, '#222233');
  for (let i = 0; i < 12; i++) {
    const bx = 10 + i * 30;
    drawRect(bx, 28 + (i % 3) * 6, 18, 62, '#2a2a3a');
    drawRect(bx + 4, 34, 4, 4, '#445');
    drawRect(bx + 10, 34, 4, 4, '#445');
  }

  drawRect(0, 70, W, 130, PAL.road);

  drawRect(0, 70, 42, 130, PAL.curb);
  drawRect(40, 70, 3, 130, PAL.light);

  drawRect(318, 70, 42, 130, PAL.curb);
  drawRect(318, 70, 3, 130, PAL.light);

  for (let lx = 50; lx < 310; lx += 28) {
    drawRect(lx, 100, 14, 2, '#333');
    drawRect(lx, 175, 14, 2, '#333');
  }

  drawZebra();
  cars.forEach(drawCar);

  if (state !== 'menu') {
    drawMan(player.x, player.y, manColor, manColor === 'red');
  }

  if (charging && manColor === 'green') {
    const barW = 28;
    drawRect(player.x - barW/2, player.y - 36, barW, 4, '#111');
    drawRect(player.x - barW/2, player.y - 36, barW * charge, 4, charge > 0.7 ? PAL.yellow : PAL.green);
  }

  if (state === 'menu') {
    ctx.fillStyle = 'rgba(0,0,0,0.78)';
    ctx.fillRect(0, 0, W, H);
    drawPedSignal(W / 2, 70);

    ctx.fillStyle = PAL.yellow;
    ctx.font = '16px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText('XWALK', W / 2, 172);

    ctx.fillStyle = PAL.white;
    ctx.font = '7px "Press Start 2P"';
    ctx.fillText('Hold to charge hop', W / 2, 188);
  }

  if (state === 'dead' || state === 'win') {
    ctx.fillStyle = 'rgba(0,0,0,0.68)';
    ctx.fillRect(0, 60, W, 80);
    ctx.fillStyle = state === 'win' ? PAL.green : PAL.red;
    ctx.font = '16px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText(state === 'win' ? 'SAFE!' : 'RUN OVER', W / 2, 95);
    ctx.fillStyle = PAL.white;
    ctx.font = '8px "Press Start 2P"';
    ctx.fillText('TAP to retry', W / 2, 120);
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  ctx.save();
  ctx.scale(SCALE, SCALE);
  draw();
  ctx.restore();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
