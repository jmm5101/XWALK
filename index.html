<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>XWALK — Red & Green Man</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: #1a1a2e;
    color: #eee;
    font-family: 'Press Start 2P', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    overflow: hidden;
    padding-top: 8px;
    touch-action: none;
  }
  h1 {
    font-size: 16px;
    margin-bottom: 6px;
    color: #ffcc00;
    text-shadow: 2px 2px 0 #000;
  }
  #game-wrap {
    position: relative;
    border: 4px solid #444;
    box-shadow: 0 0 16px #000;
    max-width: 100vw;
  }
  canvas {
    display: block;
    width: 100%;
    max-width: 640px;
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #111;
    touch-action: none;
  }
  #ui {
    width: 100%;
    max-width: 640px;
    margin-top: 8px;
    text-align: center;
    font-size: 10px;
    line-height: 1.5;
    padding: 0 8px;
  }
  .btn {
    display: inline-block;
    padding: 12px 18px;
    margin: 6px;
    background: #222;
    border: 3px solid #666;
    color: #fff;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
  }
  .btn:active { transform: scale(0.96); }
  .btn.red { border-color: #c00; color: #f66; }
  .btn.green { border-color: #0a0; color: #6f6; }
  #timer { color: #ffcc00; font-size: 14px; }
  #msg { min-height: 28px; margin: 6px 0; font-size: 11px; }

  /* Touch controls — big for phones */
  #touch-controls {
    display: none;
    width: 100%;
    max-width: 640px;
    margin-top: 10px;
    gap: 12px;
    justify-content: center;
    align-items: center;
  }
  .tbtn {
    width: 72px;
    height: 72px;
    background: #222;
    border: 4px solid #555;
    color: #fff;
    font-size: 28px;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    border-radius: 8px;
  }
  .tbtn:active, .tbtn.active {
    background: #333;
    border-color: #ffcc00;
    color: #ffcc00;
  }
  .tbtn.fwd {
    width: 88px;
    height: 88px;
    font-size: 32px;
    border-color: #0a0;
  }
</style>
</head>
<body>
  <h1>XWALK</h1>
  <div id="game-wrap">
    <canvas id="c" width="640" height="480"></canvas>
  </div>
  <div id="ui">
    <div id="msg">Choose your man</div>
    <div id="menu">
      <button class="btn red" id="btn-red">RED MAN</button>
      <button class="btn green" id="btn-green">GREEN MAN</button>
    </div>
    <div id="hud" style="display:none">
      <span id="timer">60</span>s
    </div>
  </div>

  <!-- Big touch buttons (Green Man only) -->
  <div id="touch-controls">
    <button class="tbtn" id="t-left">◀</button>
    <button class="tbtn fwd" id="t-fwd">▲</button>
    <button class="tbtn" id="t-right">▶</button>
  </div>

<script>
// ============================================================
// XWALK — Pixel Ampelmännchen Piano-Key Crosswalk
// Touch-first • Larger sprites • Single piano-key stripe
// Red Man locked in classic akimbo pose
// ============================================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// Higher internal resolution (2× previous)
const W = 320, H = 240;
const SCALE = 2; // canvas is 640×480

const PAL = {
  black: '#000000',
  dark:  '#1a1a2e',
  gray:  '#555555',
  light: '#aaaaaa',
  white: '#eeeeee',
  red:   '#cc0000',
  green: '#00aa00',
  yellow:'#ffcc00',
  blue:  '#2244aa',
  cyan:  '#44aaaa',
  orange:'#cc6600',
  road:  '#1e1e1e',
  curb:  '#666666',
  keyW:  '#e8e0c8',
  keyB:  '#111111',
};

// Game state
let state = 'menu';
let manColor = 'green';
let timer = 60;
let stillTimer = 0;
let lastMove = 0;
let frame = 0;
let cars = [];
let piano = { y: 108, h: 28 }; // single continuous piano-key band
let player = { x: 160, y: 210, vx: 0, vy: 0, onGround: true, hopCooldown: 0 };

function resetGame(color) {
  manColor = color;
  state = 'play';
  timer = 60;
  stillTimer = 0;
  lastMove = performance.now();
  frame = 0;
  cars = [];
  player = { x: 160, y: 210, vx: 0, vy: 0, onGround: true, hopCooldown: 0 };

  document.getElementById('menu').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  document.getElementById('msg').textContent = '';

  // Show touch controls only for Green Man
  const tc = document.getElementById('touch-controls');
  if (color === 'green') {
    tc.style.display = 'flex';
  } else {
    tc.style.display = 'none';
    document.getElementById('msg').textContent = 'RED MAN stands akimbo…';
  }
}

// Touch / button hop helpers (Green only)
function doHop(dx, dy) {
  if (state !== 'play' || manColor !== 'green' || player.hopCooldown > 0) return;
  player.vx = dx;
  player.vy = dy;
  player.hopCooldown = 14;
  player.onGround = false;
  lastMove = performance.now();
  stillTimer = 0;
}

document.getElementById('t-left').addEventListener('pointerdown', e => {
  e.preventDefault();
  doHop(-4.5, -1.5);
});
document.getElementById('t-right').addEventListener('pointerdown', e => {
  e.preventDefault();
  doHop(4.5, -1.5);
});
document.getElementById('t-fwd').addEventListener('pointerdown', e => {
  e.preventDefault();
  doHop(0, -5.0);
});

// Also allow tapping the canvas for forward hop (Green)
canvas.addEventListener('pointerdown', e => {
  if (state === 'play' && manColor === 'green') {
    doHop(0, -5.0);
  } else if (state === 'dead' || state === 'win') {
    // tap to return to menu
    state = 'menu';
    document.getElementById('menu').style.display = 'block';
    document.getElementById('hud').style.display = 'none';
    document.getElementById('touch-controls').style.display = 'none';
    document.getElementById('msg').textContent = 'Choose your man';
  }
});

document.getElementById('btn-red').onclick = () => resetGame('red');
document.getElementById('btn-green').onclick = () => resetGame('green');

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// Safe zones: sidewalks + the single piano-key band
function isOnSafe(px, py) {
  // player hitbox ~16×20
  const footY = py;
  // bottom sidewalk
  if (footY >= 200) return true;
  // top sidewalk
  if (footY <= 36) return true;
  // piano key band
  if (footY >= piano.y && footY <= piano.y + piano.h) return true;
  return false;
}

function spawnCar() {
  const dir = Math.random() < 0.5 ? 1 : -1;
  // Only spawn in blacktop zones — never on the piano paint
  // Upper road: y 40–100, lower road: y 140–190
  const upper = Math.random() < 0.55;
  const y = upper
    ? 48 + Math.floor(Math.random() * 40)
    : 148 + Math.floor(Math.random() * 30);
  cars.push({
    x: dir > 0 ? -40 : 360,
    y: y,
    w: 36,
    h: 16,
    vx: dir * (1.6 + Math.random() * 1.8),
    color: Math.random() < 0.3 ? PAL.red : (Math.random() < 0.5 ? PAL.blue : PAL.orange)
  });
}

function update(dt) {
  if (state !== 'play') return;
  frame++;

  // Global 60 s timer
  timer -= dt;
  if (timer <= 0) {
    timer = 0;
    state = 'dead';
    document.getElementById('msg').textContent = 'TIME UP — RUN OVER!';
    document.getElementById('touch-controls').style.display = 'none';
    return;
  }

  // Red Man: locked, pure standing-still timeout
  if (manColor === 'red') {
    stillTimer = (performance.now() - lastMove) / 1000;
    if (stillTimer >= 60) {
      state = 'dead';
      document.getElementById('msg').textContent = 'RED MAN TIMED OUT';
      return;
    }
    // Red never moves
    player.vx = 0;
    player.vy = 0;
  } else {
    // Green hop physics
    if (player.hopCooldown > 0) player.hopCooldown--;

    player.x += player.vx;
    player.y += player.vy;

    player.vx *= 0.78;
    player.vy *= 0.78;
    if (Math.abs(player.vx) < 0.2) player.vx = 0;
    if (Math.abs(player.vy) < 0.2) player.vy = 0;

    player.x = Math.max(12, Math.min(308, player.x));
    player.y = Math.max(20, Math.min(220, player.y));

    if (Math.abs(player.vx) < 0.25 && Math.abs(player.vy) < 0.25) {
      player.onGround = true;
      if (!isOnSafe(player.x, player.y)) {
        state = 'dead';
        document.getElementById('msg').textContent = 'HIT BLACKTOP — RUN OVER!';
        document.getElementById('touch-controls').style.display = 'none';
        return;
      }
    }
  }

  // Cars (never overlap piano band)
  if (frame % 38 === 0) spawnCar();
  for (let i = cars.length - 1; i >= 0; i--) {
    const c = cars[i];
    c.x += c.vx;
    if (c.x < -50 || c.x > 370) {
      cars.splice(i, 1);
      continue;
    }
    // Safety: push car out of piano band if somehow overlapping
    if (c.y + c.h > piano.y && c.y < piano.y + piano.h) {
      if (c.y < piano.y + piano.h / 2) c.y = piano.y - c.h - 2;
      else c.y = piano.y + piano.h + 2;
    }

    if (manColor === 'green') {
      const pbox = { x: player.x - 8, y: player.y - 16, w: 16, h: 20 };
      if (rectsOverlap(pbox, c)) {
        state = 'dead';
        document.getElementById('msg').textContent = 'HIT BY CAR — RUN OVER!';
        document.getElementById('touch-controls').style.display = 'none';
        return;
      }
    }
  }

  // Win (Green only)
  if (manColor === 'green' && player.y <= 34) {
    state = 'win';
    document.getElementById('msg').textContent = 'YOU CROSSED!';
    document.getElementById('touch-controls').style.display = 'none';
  }

  document.getElementById('timer').textContent = Math.ceil(timer);
}

function drawRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
}

// Larger 16×20 Ampelmännchen-style sprites (2× previous)
function drawMan(x, y, color, isRed) {
  const c = color === 'red' ? PAL.red : PAL.green;

  if (isRed) {
    // Classic Red Man — arms akimbo / outstretched, legs together (stop pose)
    // head
    drawRect(x - 5, y - 18, 10, 8, c);
    // body
    drawRect(x - 4, y - 10, 8, 10, c);
    // arms fully out (akimbo)
    drawRect(x - 14, y - 8, 10, 5, c);
    drawRect(x + 4, y - 8, 10, 5, c);
    // hands
    drawRect(x - 16, y - 7, 3, 3, c);
    drawRect(x + 13, y - 7, 3, 3, c);
    // legs together
    drawRect(x - 3, y, 3, 8, c);
    drawRect(x + 1, y, 3, 8, c);
  } else {
    // Green Man — walking / hopping pose
    const walk = (frame >> 2) % 2;
    // head
    drawRect(x - 5, y - 18, 10, 8, c);
    // body
    drawRect(x - 4, y - 10, 8, 10, c);
    // arms swinging
    if (walk) {
      drawRect(x - 10, y - 8, 6, 5, c);
      drawRect(x + 4, y - 9, 6, 5, c);
    } else {
      drawRect(x - 10, y - 9, 6, 5, c);
      drawRect(x + 4, y - 8, 6, 5, c);
    }
    // legs hopping
    if (walk) {
      drawRect(x - 4, y, 4, 7, c);
      drawRect(x + 2, y + 2, 4, 6, c);
    } else {
      drawRect(x - 4, y + 1, 4, 6, c);
      drawRect(x + 2, y, 4, 7, c);
    }
  }
}

function drawCar(c) {
  drawRect(c.x, c.y, c.w, c.h, c.color);
  drawRect(c.x + 6, c.y + 3, 8, 6, PAL.cyan);
  drawRect(c.x + 20, c.y + 3, 8, 6, PAL.cyan);
  drawRect(c.x + 3, c.y + 12, 6, 5, PAL.black);
  drawRect(c.x + 26, c.y + 12, 6, 5, PAL.black);
}

function drawPianoKeys() {
  // Single continuous piano-key crosswalk band
  const y = piano.y;
  const h = piano.h;

  // Base white band
  drawRect(0, y, W, h, PAL.keyW);

  // Draw alternating white keys with black key overlays (classic piano look)
  const whiteW = 22;
  let x = 0;
  let i = 0;
  while (x < W) {
    // thin separator between white keys
    drawRect(x + whiteW - 1, y, 2, h, '#c8c0a8');

    // black keys (shorter, centered on the gaps) — every key except edges sometimes
    if (i % 7 !== 2 && i % 7 !== 6) { // skip typical piano black-key pattern gaps
      const bx = x + whiteW - 7;
      drawRect(bx, y, 12, Math.floor(h * 0.62), PAL.keyB);
    }
    x += whiteW;
    i++;
  }

  // Top & bottom edge lines for definition
  drawRect(0, y, W, 2, '#d0c8b0');
  drawRect(0, y + h - 2, W, 2, '#b0a890');
}

function draw() {
  // Clear
  drawRect(0, 0, W, H, PAL.dark);

  // Top sidewalk
  drawRect(0, 0, W, 32, PAL.curb);
  drawRect(0, 30, W, 3, PAL.light);

  // Road (full)
  drawRect(0, 32, W, 176, PAL.road);

  // Faint lane lines only in blacktop zones (avoid piano band)
  for (let ly of [55, 75, 160, 180]) {
    for (let lx = 0; lx < W; lx += 20) {
      drawRect(lx, ly, 10, 2, '#333');
    }
  }

  // The single piano-key crosswalk (paint)
  drawPianoKeys();

  // Bottom sidewalk
  drawRect(0, 208, W, 32, PAL.curb);
  drawRect(0, 208, W, 3, PAL.light);

  // Cars (only on asphalt)
  cars.forEach(drawCar);

  // Player
  if (state !== 'menu') {
    drawMan(player.x, player.y, manColor, manColor === 'red');
  }

  // Menu overlay
  if (state === 'menu') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = PAL.yellow;
    ctx.font = '16px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText('XWALK', W / 2, 70);
    ctx.fillStyle = PAL.white;
    ctx.font = '8px "Press Start 2P"';
    ctx.fillText('Piano-key crosswalk', W / 2, 100);
    ctx.fillText('Green hops • Red stands', W / 2, 118);
    ctx.fillText('60 seconds', W / 2, 136);
  }

  if (state === 'dead' || state === 'win') {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 80, W, 80);
    ctx.fillStyle = state === 'win' ? PAL.green : PAL.red;
    ctx.font = '14px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText(state === 'win' ? 'SAFE!' : 'RUN OVER', W / 2, 115);
    ctx.fillStyle = PAL.white;
    ctx.font = '8px "Press Start 2P"';
    ctx.fillText('TAP to retry', W / 2, 140);
  }
}

// Main loop
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  ctx.save();
  ctx.scale(SCALE, SCALE);
  draw();
  ctx.restore();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
